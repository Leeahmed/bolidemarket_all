name: bolidemarket
description: Client mobile BolideMarket — phases 8A et 8B.
publish_to: none
version: 0.8.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  go_router: ^16.2.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  phone_numbers_parser: ^9.0.17
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  clock: ^1.1.2
  web: ^1.1.1
  timezone: ^0.11.0
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app-icon.png
  min_sdk_android: 23
  remove_alpha_ios: true
flutter_native_splash:
  color: '#0B0D0F'
  image: assets/images/symbol.png
  android_12:
    color: '#0B0D0F'
    image: assets/images/symbol.png
